# Verifica continua (P1.7): a ogni push su `main` e su ogni pull request.
#
# Tre passi: test statici (`node --test`), test dell'interfaccia con Chromium (Playwright) e
# audit di accessibilità con axe-core. I test vivono in `tests/` e leggono solo i file dell'app
# (js/, data/, css/, *.html): il repository pubblico non contiene dati grezzi né gli script di
# raccolta, quindi quella cartella basta da sola.
#
# Se un passo diventa rosso per un servizio esterno (la CDN di axe-core), rilanciare il job:
# il codice dell'app non c'entra.
name: Verifica

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test statici (motore, uffici, offline, contrasto, tema, feedback, pagine)
        run: npm test

      - name: Installa Playwright (solo Chromium)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Test dell'interfaccia (12 casi)
        run: npm run test:ui

      - name: Accessibilità (axe) — fallisce se trova violazioni gravi
        run: npm run test:a11y
