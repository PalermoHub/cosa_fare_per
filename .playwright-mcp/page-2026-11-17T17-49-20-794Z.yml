      - generic [ref=e16]:
        - article [ref=e17]:
          - paragraph [ref=e18]: Anagrafe e Stato Civile
          - heading "Carta d'identità elettronica (CIE)" [level=2] [ref=e19]
          - paragraph [ref=e20]:
            - strong [ref=e21]: Informazione preparata.
            - text: "Non è ancora stata verificata da una persona: confermala allo sportello o con l'ufficio competente prima di presentare la domanda."
          - paragraph [ref=e22]: La CIE si chiede agli sportelli anagrafici del Comune (sede centrale o postazioni decentrate nelle circoscrizioni), su appuntamento.
          - generic [ref=e23]:
            - heading "Come fare" [level=3] [ref=e24]
            - list [ref=e25]:
              - listitem [ref=e26]: Prenota l'appuntamento allo sportello anagrafico (on line o per telefono) e presentati con il vecchio documento, una foto tessera recente e la tessera sanitaria.
              - listitem [ref=e27]: "Il documento viene stampato in sede: non è più la vecchia carta cartacea, la CIE arriva subito in formato cartaceo-tessera e le credenziali di livello 2 sono consegnate con la pratica."
              - listitem [ref=e28]: Se non puoi muoverti (motivi sanitari documentati) chiedi la CIE a distanza.
          - generic [ref=e29]:
            - heading "Cosa serve" [level=3] [ref=e30]
            - list [ref=e31]:
              - listitem [ref=e32]: Vecchio documento di identità (o denuncia di smarrimento/furto)
              - listitem [ref=e33]: Una foto tessera recente
              - listitem [ref=e34]: Tessera sanitaria / codice fiscale
              - listitem [ref=e35]: "Il costo è quello nazionale della CIE (documento + diritti di segreteria, circa 22 euro): fatti confermare l'importo allo sportello"
          - paragraph [ref=e36]:
            - strong [ref=e37]: Da sapere.
            - text: "La carta d'identità è un servizio dell'Area Servizi Demografici: gli sportelli stanno anche nelle sedi di circoscrizione e nelle postazioni decentrate. Prenotazione e disponibilità cambiano di sede in sede: verifica sul portale dei servizi online prima di andare."
